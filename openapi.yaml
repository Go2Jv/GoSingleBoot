components:
    schemas:
        CodeMsgAndData:
            properties:
                code:
                    type: integer
                data: {}
                msg:
                    type: string
            required:
                - code
                - data
                - msg
            type: object
        LoginByPassword:
            properties:
                password:
                    type: string
                username:
                    type: string
            required:
                - password
                - username
            type: object
info:
    title: API Documentation
    version: 1.0.0
openapi: 3.1.0
paths:
    /api/login:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginByPassword'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMsgAndData'
                    description: OK
            summary: Login
    /docs:
        get:
            responses:
                "200":
                    description: Successful response
            summary: Handler
